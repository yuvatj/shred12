<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="description" content="Track weight, BMI, water and calories against your ideal 12-week fat-loss plan.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shred12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Shred12 — Fitness Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="appbar-title">
        <h1 id="viewTitle">Today</h1>
        <small id="viewSub"></small>
      </div>
      <div class="date-chip">
        <button id="prevDay" aria-label="Previous day">‹</button>
        <label class="date-label"><span id="dayLabel"></span><input type="date" id="dayPicker"></label>
        <button id="nextDay" aria-label="Next day">›</button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="nav">
      <a data-view="home" class="active"><i>⌂</i><span>Home</span></a>
      <a data-view="food"><i>🍽</i><span>Food</span></a>
      <a data-view="train"><i>🏋</i><span>Train</span></a>
      <a data-view="plan"><i>🗓</i><span>Plan</span></a>
      <a data-view="me"><i>☺</i><span>Me</span></a>
    </nav>

    <div id="modal" class="sheet-wrap hidden"><div class="sheet"><div class="sheet-handle"></div><button class="sheet-x" id="modalX" aria-label="Close">✕</button><div id="modalBody"></div></div></div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="data/exercises.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/science.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/coach.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
